{% extends 'base.html' %}

{% block title %}{{ quiz.title }}{% endblock %}

{% block content %}
<h2>{{ quiz.title }}</h2>
<p>{{ quiz.description }}</p>
<small>Автор: {{ quiz.created_by.username }} | Створено: {{ quiz.created_at|date:"d.m.Y H:i" }}</small>
<hr>
<a href="{% url 'take_quiz' quiz.id %}" class="btn btn-primary">Почати вікторину</a>
<a href="{% url 'student_dashboard' %}" class="btn btn-secondary">Назад</a>
{% endblock %}
