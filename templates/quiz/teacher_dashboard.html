{% extends 'base.html' %}
{% block title %}Панель вчителя{% endblock %}

{% block content %}
<h2 class="mb-4">Мої класи</h2>

<!-- Форма створення класу -->
<div class="mb-4">
    <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <input type="text" name="class_name" class="form-control" placeholder="Назва класу" required>
        <button type="submit" class="btn btn-primary">Створити клас</button>
    </form>
</div>

<div class="row">
    {% for class in classes %}
    <div class="col-md-4 mb-3">
        <div class="card shadow-sm p-3">
            <h5>{{ class.name }}</h5>
            <p>Код класу: <strong>{{ class.code }}</strong></p>
            <a href="{% url 'class_results' class.id %}" class="btn btn-outline-primary w-100">Переглянути результати</a>
        </div>
    </div>
    {% empty %}
    <p>У вас ще немає класів.</p>
    {% endfor %}
</div>
{% endblock %}
