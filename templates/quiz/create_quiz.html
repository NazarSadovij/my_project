{% extends 'base.html' %}
{% block title %}Створення вікторини{% endblock %}
{% block content %}
<h2>Створити вікторину для класу {{ classroom.name }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Створити</button>
</form>
<a href="{% url 'teacher_dashboard' %}">Назад до панелі</a>
{% endblock %}
